# 1. Database Connection
# Use PostgreSQL if on Railway, but use H2 (in-memory) by default locally
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:skillvibedb}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:${POSTGRES_USER:sa}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:}}




# 2. Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
# Hibernate detects the dialect automatically for Postgres

# 3. Security and JWT
# JWT_SECRET is configured in Railway as an environment variable
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000

# 4. Logs Format
logging.level.org.springframework.web=INFO

# 5. CORS Configuration
# CORS_ORIGINS and FRONTEND_URL are configured in Railway as environment variables
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://skill-vibe-f.vercel.app}
app.frontend.url=${FRONTEND_URL:https://skill-vibe-f.vercel.app}

# 6. Email Configuration
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${MAIL_USERNAME:skillvibess0@gmail.com}

# 7. Request Size (for base64 image uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.servlet.load-on-startup=1
