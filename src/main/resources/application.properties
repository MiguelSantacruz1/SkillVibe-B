# 1. Conexion a la Base de Datos
# Usar PostgreSQL si estn en Railway, pero usar H2 (memoria) por defecto en local
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:skillvibedb}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:${POSTGRES_USER:sa}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:}}




# 2. Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate detecta el dialecto automáticamente para Postgres

# 3. Seguridad y JWT
# En la nube debes configurar la variable JWT_SECRET en el dashboard de Railway
app.jwt.secret=${JWT_SECRET:SkillVibe_fesa81852027_Secure_JWT_Key_UCC_Pasto_2026_!}
app.jwt.expiration=86400000

# 4. Formato de Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# 5. Configuración de CORS
# Se traen desde las variables de entorno o usa los de Vercel/Local por defecto
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://skillvibe-frontend.vercel.app,https://skillvibe-frontend-iatv.vercel.app,https://skillvibe-frontend-iatv-dz73ha30r-miguelsantacruz1s-projects.vercel.app,https://skillvibe-frontend-iatv.vercel.app}

# 6. Wompi Payments (Colombia - COP)
# Configura el proveedor: mock (local/pruebas) o wompi (producción)
payment.provider=${PAYMENT_PROVIDER:mock}
# Obtén tus llaves en https://dashboard.wompi.co/ -> Configuracion -> Llaves
wompi.private.key=${WOMPI_PRIVATE_KEY:prv_test_REEMPLAZAR_CON_TU_LLAVE_PRIVADA}
wompi.event.secret=${WOMPI_EVENT_SECRET:test_events_secret_REEMPLAZAR_CON_TU_SECRETO}
wompi.api.url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
wompi.checkout.url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/l}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}