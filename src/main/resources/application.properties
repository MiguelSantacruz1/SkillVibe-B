# 1. Conexion a la Base de Datos
# Usar PostgreSQL si estn en Railway, pero usar H2 (memoria) por defecto en local
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:skillvibedb}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:${POSTGRES_USER:sa}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:}}




# 2. Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate detecta el dialecto automáticamente para Postgres

# 3. Seguridad y JWT
# En la nube debes configurar la variable JWT_SECRET en el dashboard de Railway
app.jwt.secret=${JWT_SECRET:SkillVibe_fesa81852027_Secure_JWT_Key_UCC_Pasto_2026_!}
app.jwt.expiration=86400000

# 4. Formato de Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# 5. Configuración de CORS
# Se traen desde las variables de entorno o usa los de Vercel/Local por defecto
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# 6. Configuración de correo (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@skillvibes.co}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
