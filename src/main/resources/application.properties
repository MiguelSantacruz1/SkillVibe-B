# 1. Conexion a la Base de Datos
# Usar PostgreSQL si estan en Railway, pero usar H2 (memoria) por defecto en local
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:skillvibedb}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:${POSTGRES_USER:sa}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:}}




# 2. Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate detecta el dialecto automaticamente para Postgres

# 3. Seguridad y JWT
# JWT_SECRET se configura en Railway como variable de entorno
app.jwt.secret=${JWT_SECRET:SkillVibe_Temporal_Secret_Key_Change_In_Prod_!}
app.jwt.expiration=86400000

# 4. Formato de Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# 5. Configuracion de CORS
# CORS_ORIGINS y FRONTEND_URL se configuran en Railway como variables de entorno
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://skill-vibe-f.vercel.app}
app.frontend.url=${FRONTEND_URL:https://skill-vibe-f.vercel.app}

# 6. Configuracion de correo (Gmail SMTP)
# MAIL_USERNAME y MAIL_PASSWORD se configuran en Railway como variables de entorno
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:skillvibess0@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
